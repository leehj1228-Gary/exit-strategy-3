<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" font-family="-apple-system,'Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="440" height="200" fill="#ffffff"/>
  <text x="14" y="22" font-size="15" font-weight="bold" fill="#1f2329">이동 타입 — 승자 vs 패자 (92판 누적)</text>
  <!-- 범례 -->
  <rect x="300" y="11" width="11" height="11" rx="2" fill="#2f6fed"/><text x="315" y="21" font-size="11" fill="#555">승자</text>
  <rect x="356" y="11" width="11" height="11" rx="2" fill="#e0463e"/><text x="371" y="21" font-size="11" fill="#555">패자</text>

  <!-- 탈출 -->
  <text x="14" y="62" font-size="13" font-weight="bold" fill="#1aa64b">탈출</text>
  <rect x="90" y="40" width="300" height="16" rx="3" fill="#2f6fed"/><text x="396" y="53" font-size="12" font-weight="bold" fill="#2f6fed">183</text>
  <rect x="90" y="60" width="23" height="16" rx="3" fill="#e0463e"/><text x="119" y="73" font-size="12" font-weight="bold" fill="#e0463e">14</text>

  <!-- 제거 -->
  <text x="14" y="132" font-size="13" font-weight="bold" fill="#b32a23">제거</text>
  <rect x="90" y="110" width="38" height="16" rx="3" fill="#2f6fed"/><text x="134" y="123" font-size="12" font-weight="bold" fill="#2f6fed">23</text>
  <rect x="90" y="130" width="52" height="16" rx="3" fill="#e0463e"/><text x="148" y="143" font-size="12" font-weight="bold" fill="#e0463e">32</text>

  <text x="14" y="176" font-size="11.5" fill="#444">승자는 <tspan font-weight="bold" fill="#1aa64b">탈출을 13배 더</tspan> 한다. 반대로 <tspan font-weight="bold" fill="#b32a23">제거는 패자가 더 많이</tspan> 한다.</text>
  <text x="14" y="192" font-size="11" fill="#888">→ "탈출에 수를 써라. 제거하러 다니면 진다."</text>
</svg>
