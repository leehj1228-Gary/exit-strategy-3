<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 130" font-family="-apple-system,'Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="440" height="130" fill="#ffffff"/>
  <text x="14" y="26" font-size="15" font-weight="bold" fill="#1f2329">승리 경로 — 자가대국 92판</text>
  <!-- 탈출 2명 -->
  <text x="14" y="62" font-size="13" fill="#333">탈출 2명</text>
  <rect x="92" y="48" width="280" height="22" rx="4" fill="#eef0f3"/>
  <rect x="92" y="48" width="277" height="22" rx="4" fill="#1aa64b"/>
  <text x="380" y="64" font-size="13" font-weight="bold" fill="#1aa64b">91판 (99%)</text>
  <!-- 제거 3명 -->
  <text x="14" y="102" font-size="13" fill="#333">제거 3명</text>
  <rect x="92" y="88" width="280" height="22" rx="4" fill="#eef0f3"/>
  <rect x="92" y="88" width="4" height="22" rx="2" fill="#e0463e"/>
  <text x="104" y="104" font-size="13" font-weight="bold" fill="#e0463e">1판 (1%)</text>
  <text x="14" y="126" font-size="11" fill="#888">→ 이 게임은 사실상 '탈출 레이스'. 제거로는 거의 못 이긴다.</text>
</svg>
