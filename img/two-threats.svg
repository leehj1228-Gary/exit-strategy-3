<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" font-family="-apple-system,'Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>
  <text x="14" y="24" font-size="14" font-weight="bold" fill="#1f2329">두 갈래 위협 (이중 위협)</text>
  <g stroke="#b8bec8" stroke-width="1.5">
    <!-- 세로 corridor (col4) --><rect x="160" y="44" width="40" height="40" rx="6" fill="#e6e8eb"/><rect x="160" y="88" width="40" height="40" rx="6" fill="#e6e8eb"/><rect x="160" y="132" width="40" height="40" rx="6" fill="#1aa64b" stroke="#0d7d36"/><rect x="160" y="176" width="40" height="40" rx="6" fill="#e6e8eb"/>
    <!-- 가로 (row4) --><rect x="72" y="132" width="40" height="40" rx="6" fill="#e6e8eb"/><rect x="116" y="132" width="40" height="40" rx="6" fill="#e6e8eb"/><rect x="204" y="132" width="40" height="40" rx="6" fill="#e6e8eb"/>
  </g>
  <!-- 출구 화살표 -->
  <text x="180" y="159" font-size="16" fill="#fff" text-anchor="middle">↵</text>
  <!-- 말 A (위) + 받침 -->
  <circle cx="180" cy="64" r="14" fill="#2f6fed" stroke="#fff" stroke-width="2"/>
  <circle cx="180" cy="196" r="14" fill="#555" stroke="#fff" stroke-width="2"/><text x="180" y="200" font-size="9" fill="#fff" text-anchor="middle">받침</text>
  <!-- 말 B (왼쪽) + 받침 -->
  <circle cx="92" cy="152" r="14" fill="#2f6fed" stroke="#fff" stroke-width="2"/>
  <circle cx="224" cy="152" r="14" fill="#555" stroke="#fff" stroke-width="2"/><text x="224" y="156" font-size="9" fill="#fff" text-anchor="middle">받침</text>
  <!-- 위협 화살표 -->
  <path d="M180 82 L180 126" stroke="#1aa64b" stroke-width="3" stroke-dasharray="5 4" fill="none" marker-end="url(#g)"/>
  <path d="M110 152 L154 152" stroke="#1aa64b" stroke-width="3" stroke-dasharray="5 4" fill="none" marker-end="url(#g)"/>
  <text x="210" y="70" font-size="13" font-weight="bold" fill="#1aa64b">위협 ①</text>
  <text x="56" y="128" font-size="13" font-weight="bold" fill="#1aa64b">위협 ②</text>
  <text x="14" y="252" font-size="12" fill="#444">두 말이 <tspan font-weight="bold">서로 다른 방향</tspan>에서 동시에 출구를 노리면,</text>
  <text x="14" y="270" font-size="12" fill="#444">상대 헌터 <tspan font-weight="bold" fill="#b32a23">하나로는 두 길을 다 막지 못한다.</tspan></text>
  <text x="14" y="290" font-size="11" fill="#888">→ 양 팔(위·아래)에 말을 분산 배치하는 이유.</text>
  <defs><marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1aa64b"/></marker></defs>
</svg>
